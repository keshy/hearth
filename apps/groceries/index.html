<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Groceries</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <script src="/_hearth/hearth.js"></script>
  <link rel="stylesheet" href="/_hearth/theme.css">
  <link rel="stylesheet" href="/_hearth/kit.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="bar">
    <a class="back" id="portal-link" href="/">All apps</a>
    <h1>Groceries</h1>
    <button class="theme-toggle" data-hearth-theme-toggle></button>
  </header>

  <main class="page">
    <section class="card add">
      <form id="add-form" class="row">
        <label class="grow">
          <span class="sr-only">Item</span>
          <input id="item" autocomplete="off" placeholder="Milk, eggs, coffee…" required maxlength="80">
        </label>
        <button type="submit">Add</button>
      </form>
      <p id="status" class="status" role="status" aria-live="polite"></p>
    </section>

    <section class="card">
      <div class="row head">
        <h2 class="grow">To buy</h2>
        <span class="chip accent" id="todo-count" hidden></span>
      </div>
      <ul id="todo" class="list items"></ul>
      <p id="empty" class="empty" hidden>Nothing on the list. Add something above.</p>
    </section>

    <section class="card" id="done-card" hidden>
      <div class="row head">
        <h2 class="grow">In the cart</h2>
        <button type="button" class="ghost small" id="clear">Clear the cart</button>
      </div>
      <ul id="done" class="list items done"></ul>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
