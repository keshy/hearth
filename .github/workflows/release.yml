name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: go run ./cmd/appshome check
      - name: Build bundles
        run: scripts/release.sh "$GITHUB_REF_NAME" "git@github.com:$GITHUB_REPOSITORY.git"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=(--generate-notes --verify-tag)
          # Tags like v0.2.0-rc1 don't become "latest", so installs skip them.
          [[ "$GITHUB_REF_NAME" == *-* ]] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" dist/* "${flags[@]}"
